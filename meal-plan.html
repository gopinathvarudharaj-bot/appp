<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodTracker – Meal Planner</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="logo-svg" width="28" height="28">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
                    </svg></div><span class="logo-text">FoodTracker</span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Navigation populated by JS -->
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-link" onclick="logout()"><svg xmlns="http://www.w3.org/2000/svg" width="20"
                        height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="nav-icon-svg"
                        style="display:inline-block;vertical-align:middle;margin-right:12px;width:20px;height:20px">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg> Logout</a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
                    <h1 class="topbar-title">Meal Planner</h1>
                </div>
                <div class="topbar-actions">
                    <button data-theme-toggle
                        style="background:none;border:none;cursor:pointer;font-size:20px">🌙</button>
                    <button class="btn btn-outline btn-sm" onclick="Toast.show('Meal plan exported!','success')">📤
                        Export</button>
                    <div class="topbar-profile-group">
                        <a href="achievements.html" class="topbar-icon-btn" title="Achievements">🏆</a>
                        <a href="settings.html" class="topbar-icon-btn" title="Settings">⚙️</a>
                        <a href="profile.html" class="profile-avatar-small" id="userAvatarSmall" title="Profile">JD</a>
                    </div>
                </div>
            </header>

            <main class="page-content page-entrance">
                <div class="page-header">
                    <h1>🍽️ Weekly Meal Planner</h1>
                    <p>Plan your meals for the week. Click any cell to edit.</p>
                </div>

                <div class="section-card reveal-item reveal-3" style="overflow-x:auto">
                    <div id="mealPlannerGrid" class="meal-planner-grid" style="min-width:700px"></div>
                </div>

                <!-- Nutrition summary per day -->
                <div class="section-card mt-24 reveal-item reveal-4">
                    <div class="dash-card-title reveal-item reveal-2" style="margin-bottom:14px">📊 Estimated Weekly
                        Calories</div>
                    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center">
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Mon</div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Tue</div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Wed</div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Thu</div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Fri</div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Sat</div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-muted)">Sun</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">1950</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">1820</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">2010</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">1890</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">1780</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">2200</div>
                        <div style="font-size:14px;font-weight:700;color:var(--accent-green)">1650</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                        <div style="font-size:11px;color:var(--text-muted)">kcal</div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
