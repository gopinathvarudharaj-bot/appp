<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodTracker – Reports</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="toast-container"></div>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="logo-svg" width="28" height="28">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
                    </svg></div><span class="logo-text">FoodTracker</span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Navigation populated by JS -->
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-link" onclick="logout()"><svg xmlns="http://www.w3.org/2000/svg" width="20"
                        height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="nav-icon-svg"
                        style="display:inline-block;vertical-align:middle;margin-right:12px;width:20px;height:20px">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg> Logout</a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
                    <h1 class="topbar-title">Reports</h1>
                </div>
                <div class="topbar-actions">
                    <button data-theme-toggle
                        style="background:none;border:none;cursor:pointer;font-size:20px">🌙</button>
                    <div class="topbar-profile-group">
                        <a href="achievements.html" class="topbar-icon-btn" title="Achievements">🏆</a>
                        <a href="settings.html" class="topbar-icon-btn" title="Settings">⚙️</a>
                        <a href="profile.html" class="profile-avatar-small" id="userAvatarSmall" title="Profile">JD</a>
                    </div>
                </div>
            </header>

            <main class="page-content page-entrance">
                <div class="page-header">
                    <h1>📊 Reports & Analytics</h1>
                    <p>Visualize your nutrition trends over time</p>
                </div>

                <!-- Period + Export -->
                <div
                    style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px">
                    <div class="period-tabs">
                        <div class="period-tab active">Daily</div>
                        <div class="period-tab">Weekly</div>
                        <div class="period-tab">Monthly</div>
                    </div>
                    <div class="export-bar" style="margin:0">
                        <button class="btn btn-outline btn-sm" onclick="mockExport('PDF')">📄 Export PDF</button>
                        <button class="btn btn-outline btn-sm" onclick="mockExport('CSV')">📊 Export CSV</button>
                    </div>
                </div>

                <!-- Stat Cards -->
                <div class="summary-grid"
                    style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-bottom:24px"
                    id="reportStats"></div>

                <!-- Charts grid -->
                <div class="reports-grid">
                    <div class="report-card">
                        <div class="report-title">📈 Weekly Calorie Trend</div>
                        <div class="chart-wrap" style="height:240px"><canvas id="weeklyCalChart"></canvas></div>
                    </div>
                    <div class="report-card">
                        <div class="report-title">🍰 Meal Distribution</div>
                        <div class="chart-wrap" style="height:240px"><canvas id="categoryPieChart"></canvas></div>
                    </div>
                </div>
                <div class="report-card" style="margin-bottom:20px">
                    <div class="report-title">🏋️‍♂️ Weekly Macro Distribution</div>
                    <div class="chart-wrap" style="height:260px"><canvas id="macroBarChart"></canvas></div>
                </div>
                <div class="report-card">
                    <div class="report-title">📅 30-Day Calorie History</div>
                    <div class="chart-wrap" style="height:240px"><canvas id="monthlyChart"></canvas></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function mockExport(type) {
            if (type === 'PDF') {
                Toast.show('Generating PDF...', 'info');
                const element = document.querySelector('.page-content');
                const opt = {
                    margin: 10,
                    filename: `foodtracker_report_${new Date().toISOString().split('T')[0]}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save().then(() => {
                    Toast.show('PDF downloaded! 📄', 'success');
                });
            } else if (type === 'CSV') {
                const foods = FoodManager.getFoods();
                if (!foods.length) { Toast.show('No data to export.', 'warning'); return; }
                const header = 'Name,Quantity,Unit,Meal,Calories,Protein,Fat,Carbs,Sugar,Date\n';
                const rows = foods.map(f => [
                    `"${(f.name || '').replace(/"/g, '""')}"`,
                    f.quantity, f.unit, f.meal,
                    f.calories, f.protein, f.fat, f.carbs, f.sugar, f.date
                ].join(',')).join('\n');
                const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `foodtracker_full_export_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 100);
                Toast.show('CSV exported! 📥', 'success');
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            const foods = FoodManager.getFoods();
            const goals = storage.get('foodtracker_goals', DEFAULT_GOALS);
            const avgCal = foods.length ? Math.round(foods.reduce((a, f) => a + parseFloat(f.calories || 0), 0) / Math.max(1, [...new Set(foods.map(f => f.date))].length)) : 0;
            const s = document.getElementById('reportStats');
            if (s) s.innerHTML = [
                { label: 'Total Entries', val: foods.length, icon: '📊', color: 'green' },
                { label: 'Avg Daily Cal', val: avgCal, icon: '🔥', color: 'orange' },
                { label: 'Days Logged', val: [...new Set(foods.map(f => f.date))].length, icon: '📅', color: 'blue' },
                { label: 'Calorie Goal', val: goals.calories, icon: '🎯', color: 'purple' },
            ].map(i => `<div class="summary-card reveal-item reveal-2"><div class="card-icon ${i.color}">${i.icon}</div><div class="card-value text-${i.color}">${i.val}</div><div class="card-label">${i.label}</div></div>`).join('');
        });
    </script>
</body>

</html>
